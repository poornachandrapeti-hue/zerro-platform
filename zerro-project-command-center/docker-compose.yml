services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: zerro_dashboard
      POSTGRES_USER: zerro
      POSTGRES_PASSWORD: ${COMMAND_CENTER_DB_PASSWORD:?Set COMMAND_CENTER_DB_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zerro -d zerro_dashboard"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://zerro:${COMMAND_CENTER_DB_PASSWORD}@db:5432/zerro_dashboard
      FRONTEND_ORIGINS: http://localhost:5173,http://localhost:8080
      COMMAND_CENTER_SSO_SECRET: ${COMMAND_CENTER_SSO_SECRET:-}
      COMMAND_CENTER_EXPECTED_ORG: ${COMMAND_CENTER_EXPECTED_ORG:-}
      COMMAND_CENTER_PROJECT_MAP: ${COMMAND_CENTER_PROJECT_MAP:-{}}
      COMMAND_CENTER_COOKIE_SECURE: ${COMMAND_CENTER_COOKIE_SECURE:-true}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: ""
    ports:
      - "8080:80"
    depends_on:
      - backend

volumes:
  postgres_data:

