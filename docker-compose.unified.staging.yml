# Fresh staging only: single PostgreSQL database, with per-service schemas.
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_SUPERUSER_PASSWORD:?Set POSTGRES_SUPERUSER_PASSWORD}
      POSTGRES_DB: postgres
      SITEFORGE_DB_PASSWORD: ${SITEFORGE_DB_PASSWORD:?Set SITEFORGE_DB_PASSWORD}
      COMMAND_CENTER_DB_PASSWORD: ${COMMAND_CENTER_DB_PASSWORD:?Set COMMAND_CENTER_DB_PASSWORD}
    volumes:
      - unified_pg_data:/var/lib/postgresql/data
      - ./deployment/init/01-databases.sh:/docker-entrypoint-initdb.d/01-databases.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 5s
      retries: 20
  siteforge_migrate:
    build: ./siteforge/backend
    command: ["alembic", "upgrade", "head"]
    environment:
      DATABASE_URL: postgresql+psycopg://siteforge:${SITEFORGE_DB_PASSWORD:?Set SITEFORGE_DB_PASSWORD}@db:5432/siteforge
    depends_on:
      db: {condition: service_healthy}
  siteforge_backend:
    build: ./siteforge/backend
    environment:
      DATABASE_URL: postgresql+psycopg://siteforge:${SITEFORGE_DB_PASSWORD}@db:5432/siteforge
      COMMAND_CENTER_SSO_SECRET: ${COMMAND_CENTER_SSO_SECRET:?Set COMMAND_CENTER_SSO_SECRET}
      COMMAND_CENTER_IDENTITY_SERVICE_KEY: ${ZERROR_INTERNAL_SERVICE_KEY:?Set ZERROR_INTERNAL_SERVICE_KEY}
      VISION360_SERVICE_KEY: ${ZERROR_INTERNAL_SERVICE_KEY:?Set ZERROR_INTERNAL_SERVICE_KEY}
      VISION360_ORGANIZATION_ID: ${COMMAND_CENTER_EXPECTED_ORG:?Set COMMAND_CENTER_EXPECTED_ORG}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      FILE_ROOT: /data/files
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:8080}
    networks:
      default:
        aliases:
          - siteforge-backend
    volumes:
      - siteforge_files:/data/files
    depends_on:
      siteforge_migrate: {condition: service_completed_successfully}
  command_backend:
    build: ./zerro-project-command-center/backend
    environment:
      DATABASE_URL: postgresql+psycopg://commandcenter:${COMMAND_CENTER_DB_PASSWORD:?Set COMMAND_CENTER_DB_PASSWORD}@db:5432/siteforge
      COMMAND_CENTER_DB_SCHEMA: command_center
      COMMAND_CENTER_IDENTITY_URL: http://siteforge-backend:8000
      COMMAND_CENTER_IDENTITY_SERVICE_KEY: ${ZERROR_INTERNAL_SERVICE_KEY:?Set ZERROR_INTERNAL_SERVICE_KEY}
      COMMAND_CENTER_SSO_SECRET: ${COMMAND_CENTER_SSO_SECRET}
      COMMAND_CENTER_EXPECTED_ORG: ${COMMAND_CENTER_EXPECTED_ORG:?Set COMMAND_CENTER_EXPECTED_ORG}
      COMMAND_CENTER_PROJECT_MAP: ${COMMAND_CENTER_PROJECT_MAP:-{}}
      COMMAND_CENTER_DISCIPLINE_MAP: ${COMMAND_CENTER_DISCIPLINE_MAP:-{}}
      VISION360_SOURCE_URL: http://siteforge-backend:8000
      VISION360_SERVICE_KEY: ${ZERROR_INTERNAL_SERVICE_KEY:?Set ZERROR_INTERNAL_SERVICE_KEY}
      COMMAND_CENTER_COOKIE_SECURE: ${COOKIE_SECURE:-false}
      FRONTEND_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:8080}
    depends_on:
      db: {condition: service_healthy}
  frontend:
    build: ./siteforge/frontend
    ports:
      - "127.0.0.1:${UNIFIED_WEB_PORT:-8080}:80"
    depends_on:
      - siteforge_backend
      - command_backend
volumes:
  unified_pg_data:
  siteforge_files:
